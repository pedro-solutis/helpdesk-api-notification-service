server:
  port: 8083

spring:
  application:
    name: notification
  datasource:
    url: ${DATASOURCE_NAME:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:root}
    driver-class-name: ${DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  config:
    import: optional:file:.env[.properties]
    
api:
  security:
    token:
      secret: ${JWT_SECRET:mySuperSecretKey123!}
      issuer: ${JWT_ISSUER:user-service}
  messager:
    exchange: ${RABBIT_EXCHANGE:ticket.exchange}
    queue: ${RABBITMQ_NOTIFICATION_QUEUE:notification.queue}
    routing-key: ${RABBITMQ_ROUTING_KEY:ticket.#}
