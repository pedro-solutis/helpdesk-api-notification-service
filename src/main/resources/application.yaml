server:
  port: 8083

spring:
  application:
    name: notification
  datasource:
    url: ${DATASOURCE_NAME:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  config:
    import: optional:file:.env[.properties]

springdoc:
  servers:
    - url: ${GATEWAY_URL:http://localhost:8080/api}
    
api:
  security:
    jwt:
      secret: ${JWT_SECRET:mySuperSecretKey123!}
      issuer: ${JWT_ISSUER:user-service}
